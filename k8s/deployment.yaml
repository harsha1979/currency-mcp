apiVersion: v1
kind: Namespace
metadata:
  name: internal-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-mcp
  namespace: internal-mcp
  labels:
    app: currency-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currency-mcp
  template:
    metadata:
      labels:
        app: currency-mcp
    spec:
      containers:
        - name: currency-mcp
          image: <account-id>.dkr.ecr.<region>.amazonaws.com/currency-mcp:0.1.0  # set to your image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FRANKFURTER_BASE_URL
              value: "https://api.frankfurter.app"
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: currency-mcp
  namespace: internal-mcp
  labels:
    app: currency-mcp
spec:
  type: ClusterIP
  selector:
    app: currency-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
